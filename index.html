<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2a1e12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>La Colonie - Les Premiers Feux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        canvas {
            touch-action: none;
            display: block;
        }
        /* Fallback si le jeu ne démarre pas */
        .fallback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            font-size: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div class="fallback" id="fallback">
        Chargement du jeu...<br>
        <small>Si rien ne s'affiche, vérifiez la console (F12)</small>
    </div>
    <script type="module">
        import '/src/main.js';
    </script>
    <script>
        // Masquer le fallback quand Phaser est chargé
        window.addEventListener('load', () => {
            setTimeout(() => {
                const fallback = document.getElementById('fallback');
                if (fallback && window.Phaser) {
                    fallback.style.display = 'none';
                }
            }, 1000);
        });
    </script>
</body>
</html>
